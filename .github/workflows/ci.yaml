name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

# Cancel superseded runs on the same PR; never cancel push/tag builds so
# release images always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Credentials match the committed config.yaml the tests load.
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: feemanager
          POSTGRES_PASSWORD: feemanager
          POSTGRES_DB: feemanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Version and components come from rust-toolchain.toml, matching the
        # Containerfile release build.
        run: rustup toolchain install

      - name: Rust cache
        # Only the test job uses this cache; the published image is built by
        # the docker job from buildkit's own git context, so a poisoned cache
        # cannot reach release artifacts.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]

      - name: Check formatting
        run: cargo fmt --all --check

      # Queries are checked against the committed .sqlx cache, so a query
      # added without `cargo sqlx prepare` fails here.
      - name: Clippy
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  docker:
    runs-on: ubuntu-latest
    # A version tag must never publish an image the test job rejected.
    needs: [test]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Every trigger builds the image, only a version tag publishes it.
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
          flavor: latest=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build for every trigger, so a broken Containerfile fails the PR.
      # On a tag it pushes by digest: the digest is signed before any tag
      # points at it, so no tag ever resolves to an unsigned manifest.
      - name: Docker build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Containerfile
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.IMAGE }},push=${{ env.PUBLISH }},push-by-digest=${{ env.PUBLISH }},name-canonical=${{ env.PUBLISH }}

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign index and child manifests with cosign (keyless)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      # The identity is exact, not a pattern: GITHUB_WORKFLOW_REF expands to
      # <owner>/<repo>/.github/workflows/<file>@<ref>, so only a signature made
      # by this workflow on this tag passes.
      - name: Verify the signature
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            "${IMAGE}@${DIGEST}"

      - name: Apply tags to signed digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Tagging ${tag} -> ${IMAGE}@${DIGEST}"
            docker buildx imagetools create --tag "$tag" "${IMAGE}@${DIGEST}"
          done <<< "$TAGS"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The release notes point at the image, so it must be published first.
    needs: [docker]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          args=()
          [ "${PRERELEASE}" = "true" ] && args+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            "${args[@]}"

  final-check:
    name: final-check
    if: always()
    needs: [test, zizmor, docker]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify all required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
