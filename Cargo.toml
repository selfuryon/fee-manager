[package]
name = "fee-manager"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "fee_manager"

[[bin]]
path = "src/main.rs"
name = "fee-manager"

[dependencies]
axum = "0.8"
tower-http = { version = "0.7", features = ["request-id", "util"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

hex = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
rand = "0.10"
config = "0.15"
thiserror = "2"

sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
serde_with = "3.24"

tokio = { version = "1.53", features = ["full"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
rust_decimal = "1.43"
regex = "1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
